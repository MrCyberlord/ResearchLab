[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "researchlab-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pgvector>=0.4,<1",
  "pypdf>=6,<7", "python-multipart>=0.0.20,<1", "psutil>=7,<8",
  "sentence-transformers>=5.1,<5.2", "transformers>=4.57.6,<5",
  "huggingface-hub>=0.36,<1", "tokenizers>=0.22,<0.23"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
researchlab-eval = "app.evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated local PostgreSQL (RUN_DB_TESTS=1)", "semantic: real MiniLM weights (RUN_SEMANTIC_TESTS=1)", "reranker: real pinned cross-encoder weights (RUN_RERANKER_TESTS=1)", "llm_smoke: opt-in real local provider (RUN_LLM_SMOKE=1)"]
